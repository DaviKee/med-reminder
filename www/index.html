<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>定时服药提醒</title>
<meta name="description" content="自定义药品与服药间隔，每天首次打卡后自动排程当天提醒。">
<meta name="theme-color" content="#0A0A0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="phone" id="phone">

  <!-- Views -->
  <main id="main">
    <section class="view active" data-view="today"><div class="stack" id="todayView"></div></section>
    <section class="view" data-view="meds"><div class="stack" id="medsView"></div></section>
    <section class="view" data-view="records"><div class="stack" id="recordsView"></div></section>
  </main>

  <!-- Tab bar -->
  <nav class="tabbar">
    <div class="tabpill">
      <button class="tab active" data-tab="today">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5.4l3.4 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>今日</span>
      </button>
      <button class="tab" data-tab="meds">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-45 12 12)" stroke="currentColor" stroke-width="1.8"/><path d="M9 9l6 6" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>药品</span>
      </button>
      <button class="tab" data-tab="records">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M10 20V4M16 20v-7M2 20h20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>记录</span>
      </button>
    </div>
  </nav>

  <!-- Scrim -->
  <div class="scrim" id="scrim"></div>

  <!-- Add / Edit med sheet -->
  <div class="sheet" id="sheetMed" role="dialog" aria-modal="true" aria-label="添加或编辑药品">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <span class="sheet-title" id="sheetTitle">添加药品</span>
      <button class="icon-btn" id="sheetClose" aria-label="关闭">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="field">
      <label class="field-label" for="medName">药品名称</label>
      <div class="input-wrap">
        <input id="medName" type="text" placeholder="例如 维生素 D3" maxlength="20" autocomplete="off">
      </div>
    </div>

    <div class="field">
      <label class="field-label">服药间隔</label>
      <div class="stepper">
        <button class="step-btn" id="stepMinus" aria-label="减少">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div class="step-val">
          <span class="step-num num" id="stepNum">8</span>
          <span class="step-unit">小时 / 次</span>
        </div>
        <button class="step-btn step-plus" id="stepPlus" aria-label="增加">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p class="hint">每天第一次服药打卡后，将按此间隔依次生成今天的提醒时间。</p>
    </div>

    <div class="field">
      <span class="eyebrow">AUTO SCHEDULE · 以 06:00 为例</span>
      <div class="chip-row" id="previewChips"></div>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-primary" id="saveMed">保存药品</button>
      <button class="btn btn-text hidden" id="deleteMed">删除药品</button>
    </div>
  </div>

  <!-- Skip confirm dialog -->
  <div class="dlg-wrap" id="dlgSkip">
    <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="skipTitle">
      <div class="badge badge-56">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 5.5 12 12l-7 6.5M13 5.5 20 12l-7 6.5" stroke="#FF7A17" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="dlg-text">
        <div class="dlg-title" id="skipTitle">跳过本次服药？</div>
        <div class="dlg-body" id="skipBody">这次将记为未服用，会影响今日依从率。</div>
      </div>
      <div class="strip">
        <span class="eyebrow">NEXT REMINDER</span>
        <span class="strip-val" id="skipNext">22:00 · 不变</span>
      </div>
      <div class="dlg-actions">
        <button class="btn btn-ghost" id="skipCancel">取消</button>
        <button class="btn btn-accent" id="skipConfirm">确认跳过</button>
      </div>
    </div>
  </div>

  <!-- Reminder dialog -->
  <div class="dlg-wrap" id="dlgRemind">
    <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="remindName">
      <div class="badge badge-56">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M6.4 10.2a5.6 5.6 0 0 1 11.2 0c0 3.9 1.4 5.4 1.4 5.4H5s1.4-1.5 1.4-5.4Z" stroke="#FF7A17" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.9 18.6a2.3 2.3 0 0 0 4.2 0" stroke="#FF7A17" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <div class="dlg-text">
        <span class="eyebrow accent">TIME TO TAKE</span>
        <div class="dlg-title-lg" id="remindName">维生素 D3</div>
        <div class="dlg-body" id="remindMeta">14:00 · 第 2 / 3 次 · 每 8 小时</div>
      </div>
      <div class="dlg-actions-vert">
        <button class="btn btn-primary" id="remindDone">已服用</button>
        <button class="btn btn-ghost" id="remindSnooze">10 分钟后提醒</button>
      </div>
    </div>
  </div>

  <!-- Data backup / export / restore dialog -->
  <div class="dlg-wrap" id="dlgData">
    <div class="dlg dlg-wide" role="dialog" aria-modal="true" aria-labelledby="dataTitle">
      <div class="dlg-text">
        <span class="eyebrow accent" id="dataEyebrow">BACKUP</span>
        <div class="dlg-title" id="dataTitle">导出备份</div>
        <div class="dlg-body" id="dataHint"></div>
      </div>
      <textarea class="data-area" id="dataArea" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      <input type="file" id="pickBackup" class="hidden" accept="application/json,.json,text/plain">
      <div class="dlg-actions">
        <button class="btn btn-ghost" id="dataClose">关闭</button>
        <button class="btn btn-accent" id="dataCopy">复制</button>
      </div>
      <button class="btn btn-ghost" id="dataDownload">下载 .json 文件</button>
      <button class="btn btn-ghost hidden" id="dataPick">从文件选择</button>
      <button class="btn btn-primary hidden" id="dataApply">恢复</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="js/notify.js"></script>
<script src="js/app.js"></script>
</body>
</html>
